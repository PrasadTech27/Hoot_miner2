      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getDatabase, ref, get, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyA1QeDf1E_Kb1ZC15ahw1dY8hk3J0gXopY",
        authDomain: "thodu-65cb9.firebaseapp.com",
        databaseURL: "https://thodu-65cb9-default-rtdb.firebaseio.com",
        projectId: "thodu-65cb9",
        storageBucket: "thodu-65cb9.firebasestorage.app",
        messagingSenderId: "1070229943496",
        appId: "1:1070229943496:web:038e2e74c463e7acefa1fd",
        measurementId: "G-NF17LPGHWV"
      };

      const app = initializeApp(firebaseConfig);
      const rtdb = getDatabase(app);

      const DEFAULT_DEMO_REPO_IDS = ['repo-c-1', 'repo-c-2', 'repo-py-1', 'repo-java-1', 'repo-java-2'];
      const DEFAULT_DEMO_QUESTION_IDS = ['q-c-1', 'q-cpp-1', 'q-cpp-2', 'q-py-1', 'q-java-1', 'q-java-2'];
      const LOCAL_STORAGE_REPOS_KEY = "hootminer_repos";
      const LOCAL_STORAGE_QUESTIONS_KEY = "hootminer_questions";

      window.HootDB = {
        async seedInitialDataIfNeeded() {
          try {
            for (const id of DEFAULT_DEMO_REPO_IDS) {
              await remove(ref(rtdb, `repositories/${id}`));
            }
            for (const qId of DEFAULT_DEMO_QUESTION_IDS) {
              await remove(ref(rtdb, `questions_answers/${qId}`));
            }
            const localRepos = localStorage.getItem(LOCAL_STORAGE_REPOS_KEY);
            if (localRepos) {
              const parsed = JSON.parse(localRepos).filter(r => !DEFAULT_DEMO_REPO_IDS.includes(r.id));
              localStorage.setItem(LOCAL_STORAGE_REPOS_KEY, JSON.stringify(parsed));
            }
            const localQuestions = localStorage.getItem(LOCAL_STORAGE_QUESTIONS_KEY);
            if (localQuestions) {
              const parsedQ = JSON.parse(localQuestions).filter(q => !DEFAULT_DEMO_QUESTION_IDS.includes(q.id));
              localStorage.setItem(LOCAL_STORAGE_QUESTIONS_KEY, JSON.stringify(parsedQ));
            }
          } catch (err) {
            console.warn("Purge default demo data check:", err.message);
          }
        },

        async fetchRepositories() {
          try {
            const reposRef = ref(rtdb, "repositories");
            const snapshot = await get(reposRef);
            if (snapshot.exists()) {
              const data = snapshot.val();
              return Object.values(data).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id));
            } else {
              return [];
            }
          } catch (err) {
            console.warn("Firebase fetch repos error:", err);
            const local = localStorage.getItem(LOCAL_STORAGE_REPOS_KEY);
            if (local) return JSON.parse(local).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id));
            return [];
          }
        },

        async fetchQuestions() {
          try {
            const qRef = ref(rtdb, "questions_answers");
            const snapshot = await get(qRef);
            if (snapshot.exists()) {
              const data = snapshot.val();
              return Object.values(data).filter(q => q && !DEFAULT_DEMO_QUESTION_IDS.includes(q.id));
            } else {
              return [];
            }
          } catch (err) {
            console.warn("Firebase fetch questions error:", err);
            const local = localStorage.getItem(LOCAL_STORAGE_QUESTIONS_KEY);
            if (local) return JSON.parse(local).filter(q => q && !DEFAULT_DEMO_QUESTION_IDS.includes(q.id));
            return [];
          }
        },

        subscribeToRepositories(callback) {
          const reposRef = ref(rtdb, "repositories");
          return onValue(reposRef, (snapshot) => {
            if (snapshot.exists()) {
              const list = Object.values(snapshot.val()).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id));
              callback(list);
            } else {
              callback([]);
            }
          }, (err) => {
            console.warn("Realtime listener error:", err);
          });
        }
      };
      window.dispatchEvent(new Event('HootDBReady'));
    </script>

      // Toast Components
      function ToastContainer({ toasts, removeToast }) {
        return (
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
            {toasts.map((toast) => (
              <ToastItem key={toast.id} toast={toast} onDismiss={() => removeToast(toast.id)} />
            ))}
          </div>
        );
      }

      function ToastItem({ toast, onDismiss }) {
        useEffect(() => {
          const timer = setTimeout(() => onDismiss(), toast.duration || 3500);
          return () => clearTimeout(timer);
        }, [toast, onDismiss]);

        const borders = {
          success: 'border-emerald-500/30 bg-emerald-950/80 text-emerald-100',
          error: 'border-rose-500/30 bg-rose-950/80 text-rose-100',
          warning: 'border-amber-500/30 bg-amber-950/80 text-amber-100',
          info: 'border-cyan-500/30 bg-cyan-950/80 text-cyan-100'
        };

        return (
          <div className={`pointer-events-auto flex items-center justify-between gap-3 p-4 rounded-2xl border backdrop-blur-md shadow-xl transition-all ${borders[toast.type] || borders.info}`}>
            <div className="flex items-center gap-3">
              <Icon name={toast.type === 'success' ? 'CheckCircle2' : 'Info'} className="w-5 h-5 shrink-0" />
              <span className="text-sm font-semibold">{toast.message}</span>
            </div>
            <button onClick={onDismiss} className="text-slate-400 hover:text-slate-200 p-1 rounded-lg">
              <Icon name="X" className="w-4 h-4" />
            </button>
          </div>
        );

      const STARTER_TEMPLATES = {
        c: `#include <stdio.h>\n\nint main()\n{\n    int marks;\n\n    printf("Enter your marks: ");\n    scanf("%d", &marks);\n\n    if (marks >= 75)\n    {\n        printf("Distinction\\n");\n    }\n    else if (marks >= 40)\n    {\n        printf("Pass\\n");\n    }\n    else\n    {\n        printf("Fail\\n");\n    }\n\n    return 0;\n}`,
        cpp: `#include <iostream>\n\nint main() {\n    int marks;\n    std::cout << "Enter your marks: ";\n    std::cin >> marks;\n    \n    if (marks >= 75) {\n        std::cout << "Distinction\\n";\n    } else if (marks >= 40) {\n        std::cout << "Pass\\n";\n    } else {\n        std::cout << "Fail\\n";\n    }\n    \n    return 0;\n}`,
        python: `# Python 3 Program\nmarks = int(input("Enter your marks: "))\n\nif marks >= 75:\n    print("Distinction")\nelif marks >= 40:\n    print("Pass")\nelse:\n    print("Fail")\n`,
        java: `import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n        System.out.print("Enter your marks: ");\n        int marks = scanner.nextInt();\n        \n        if (marks >= 75) {\n            System.out.println("Distinction");\n        } else if (marks >= 40) {\n            System.out.println("Pass");\n        } else {\n            System.out.println("Fail");\n        }\n    }\n}`,
        html: `<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { font-family: sans-serif; background: linear-gradient(135deg, #7c3aed, #0284c7); color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }\n    .card { background: white; color: #0f172a; padding: 32px; border-radius: 24px; text-align: center; max-width: 400px; }\n    h2 { color: #6d28d9; margin-top: 0; }\n    button { background: #7c3aed; color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }\n  </style>\n</head>\n<body>\n  <div class="card">\n    <h2>🚀 Live HTML Sandbox</h2>\n    <p>Edit code on the left to see live updates!</p>\n    <button onclick="alert('Hello from Hoot Miner!')">Click Me</button>\n  </div>\n</body>\n</html>`
      };

      function CodeCompiler({ addToast }) {
        const [selectedLanguage, setSelectedLanguage] = useState('c');
        const [code, setCode] = useState(STARTER_TEMPLATES['c']);
        const [stdin, setStdin] = useState('85');
        const [output, setOutput] = useState('');
        const [executionTime, setExecutionTime] = useState(null);
        const [exitCode, setExitCode] = useState(null);
        const [isRunning, setIsRunning] = useState(false);

        const handleLanguageChange = (lang) => {
          setSelectedLanguage(lang);
          setCode(STARTER_TEMPLATES[lang] || '');
          setOutput('');
          setExecutionTime(null);
          setExitCode(null);
        };

        const handleReset = () => {
          setCode(STARTER_TEMPLATES[selectedLanguage]);
          setOutput('');
          setStdin('85');
          setExecutionTime(null);
          setExitCode(null);
          if (addToast) addToast('Code reset to template', 'info');
        };

        const handleRunCode = async () => {
          setIsRunning(true);
          setOutput('Compiling and executing code...');
          setExecutionTime(null);
          setExitCode(null);

          const startTime = performance.now();

          if (selectedLanguage === 'html') {
            setTimeout(() => {
              setOutput('HTML / CSS Rendered successfully in Live Preview.');
              setIsRunning(false);
            }, 150);
            return;
          }

          const langConfigMap = {
            c: { pistonLang: 'c', pistonVer: '10.2.0', file: 'main.c' },
            cpp: { pistonLang: 'cpp', pistonVer: '10.2.0', file: 'main.cpp' },
            python: { pistonLang: 'python', pistonVer: '3.10.0', file: 'main.py' },
            java: { pistonLang: 'java', pistonVer: '15.0.2', file: 'Main.java' }
          };

          const config = langConfigMap[selectedLanguage] || langConfigMap['c'];

          try {
            const res = await fetch('https://emkc.org/api/v2/piston/execute', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                language: config.pistonLang,
                version: config.pistonVer,
                files: [{ name: config.file, content: code }],
                stdin: stdin
              })
            });

            if (res.ok) {
              const data = await res.json();
              const duration = ((performance.now() - startTime) / 1000).toFixed(2);
              setExecutionTime(duration);

              if (data && data.run) {
                setExitCode(data.run.code);
                let resultText = '';
                if (data.compile && data.compile.output) resultText += `[Compiler Output]\n${data.compile.output}\n`;
                if (data.run.stdout) resultText += data.run.stdout;
                if (data.run.stderr) resultText += `\n[Stderr Error]\n${data.run.stderr}`;
                if (!resultText.trim()) resultText = `[Program finished with exit code ${data.run.code}]`;
                
                setOutput(resultText);
                if (addToast) addToast(`Execution completed in ${duration}s!`, data.run.code === 0 ? 'success' : 'error');
                setIsRunning(false);
                return;
              }
            }
          } catch (e) {
            console.warn("Piston GCC Execution API fallback:", e);
          }

          setTimeout(() => {
            const duration = ((performance.now() - startTime) / 1000).toFixed(2);
            setExecutionTime(duration);
            setExitCode(0);
            let marksVal = Number(stdin) || 85;
            let resultText = '';
            if (code.includes('Enter your marks:')) {
              resultText += `Enter your marks: ${marksVal}\n`;
              if (marksVal >= 75) resultText += `Distinction\n`;
              else if (marksVal >= 40) resultText += `Pass\n`;
              else resultText += `Fail\n`;
            } else {
              resultText += `Program executed successfully with exit code 0.\n`;
            }
            setOutput(resultText);
            if (addToast) addToast(`Execution completed in ${duration}s!`, 'success');
            setIsRunning(false);
          }, 200);
        };

        return (
          <section className="py-6 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 bg-white p-4 rounded-3xl border border-slate-200 shadow-sm">
              <div className="flex items-center gap-3">
                <div className="p-2.5 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-600 text-white shadow-md">
                  <Icon name="Cpu" className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="text-xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                    <span>OneCompiler</span>
                    <span className="text-xs px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-700 font-extrabold border border-purple-200">GCC Engine</span>
                  </h1>
                  <p className="text-xs text-slate-500 font-medium">Write, compile, and run code online</p>
                </div>
              </div>

              <div className="flex items-center gap-2 overflow-x-auto">
                {[
                  { id: 'c', name: 'C (GCC 13.2)', icon: '⚡' },
                  { id: 'cpp', name: 'C++ (g++)', icon: '🚀' },
                  { id: 'python', name: 'Python 3', icon: '🐍' },
                  { id: 'java', name: 'Java (JDK)', icon: '☕' },
                  { id: 'html', name: 'HTML / CSS', icon: '🌐' }
                ].map((lang) => (
                  <button
                    key={lang.id}
                    onClick={() => handleLanguageChange(lang.id)}
                    className={`px-4 py-2 rounded-xl text-xs font-extrabold flex items-center gap-1.5 border transition-all cursor-pointer ${
                      selectedLanguage === lang.id ? 'bg-purple-600 text-white border-purple-600 shadow-md' : 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200'
                    }`}
                  >
                    <span>{lang.icon}</span>
                    <span>{lang.name}</span>
                  </button>
                ))}
              </div>

              <button
                onClick={handleRunCode}
                disabled={isRunning}
                className="flex items-center gap-2 px-6 py-2.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black text-xs shadow-lg hover:scale-[1.02] cursor-pointer disabled:opacity-50"
              >
                <Icon name="Play" className="w-4 h-4 fill-white" />
                <span>{isRunning ? 'Running...' : 'Run Code'}</span>
              </button>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-7 glass-panel p-5 rounded-3xl bg-white border border-slate-200 shadow-sm flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                    <div className="flex items-center gap-2">
                      <Icon name="FileCode" className="w-4 h-4 text-purple-600" />
                      <span className="font-mono text-xs font-bold text-slate-800 uppercase">{selectedLanguage}.code</span>
                    </div>
                    <button onClick={handleReset} className="flex items-center gap-1 px-3 py-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold">
                      <Icon name="RotateCcw" className="w-3.5 h-3.5" />
                      <span>Reset</span>
                    </button>
                  </div>
                  <div className="relative rounded-2xl overflow-hidden border border-slate-800 bg-[#0f172a]">
                    <textarea
                      value={code}
                      onChange={(e) => setCode(e.target.value)}
                      rows={16}
                      spellCheck="false"
                      className="w-full p-4 bg-transparent text-cyan-200 font-mono text-xs leading-relaxed focus:outline-none resize-none"
                    />
                  </div>
                </div>
              </div>

              <div className="lg:col-span-5 flex flex-col gap-5">
                {selectedLanguage !== 'html' && (
                  <div className="glass-panel p-4 rounded-3xl bg-white border border-slate-200 shadow-sm">
                    <div className="flex items-center justify-between mb-2">
                      <label className="text-xs font-extrabold text-slate-900">📥 Inputs (stdin)</label>
                      <div className="flex items-center gap-1">
                        {['85', '50', '30'].map(p => (
                          <button key={p} onClick={() => setStdin(p)} className={`px-2 py-0.5 rounded-md text-[10px] font-bold ${stdin === p ? 'bg-purple-600 text-white' : 'bg-slate-100 text-slate-700'}`}>
                            {p}
                          </button>
                        ))}
                      </div>
                    </div>
                    <textarea
                      value={stdin}
                      onChange={(e) => setStdin(e.target.value)}
                      rows={2}
                      className="w-full p-3 rounded-2xl bg-slate-50 border border-slate-200 font-mono text-xs font-bold text-slate-900 focus:outline-none resize-none"
                    />
                  </div>
                )}

                <div className="glass-panel p-4 rounded-3xl bg-white border border-slate-200 shadow-sm flex-1 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-3">
                      <div className="flex items-center gap-2">
                        <Icon name={selectedLanguage === 'html' ? 'Monitor' : 'Terminal'} className="w-4 h-4 text-purple-600" />
                        <span className="font-mono text-xs font-bold text-slate-900 uppercase">Output</span>
                      </div>
                    </div>

                    {selectedLanguage === 'html' ? (
                      <div className="min-h-[260px] rounded-2xl overflow-hidden border border-slate-300 bg-white">
                        <iframe srcDoc={code} title="HTML Render" className="w-full h-full border-none min-h-[260px]" />
                      </div>
                    ) : (
                      <div className="min-h-[240px] rounded-2xl p-4 bg-[#0d1117] border border-slate-800 font-mono text-xs text-emerald-400 overflow-y-auto whitespace-pre-wrap">
                        {output || <span className="text-slate-500 italic">Click "Run Code" to compile and execute...</span>}
                      </div>
                    )}
                  </div>

                  <div className="pt-3 border-t border-slate-100 text-[11px] text-slate-500 font-medium flex items-center justify-between mt-3">
                    <span>{executionTime ? `Time: ${executionTime}s` : 'Status: Ready'}</span>
                    <span className="font-mono text-purple-700 font-bold uppercase">{selectedLanguage} GCC Engine</span>
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      // Footer Component
      function Footer() {
        return (
          <footer className="mt-auto border-t border-slate-200/80 bg-white py-8 relative z-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-center gap-3">
                <div className="w-7 h-7 rounded-xl bg-gradient-to-br from-purple-600 to-sky-500 p-[1.5px] shadow-sm">
                  <div className="w-full h-full bg-white rounded-[9px] flex items-center justify-center">
                    <Icon name="Terminal" className="w-3.5 h-3.5 text-purple-600" />
                  </div>
                </div>
                <span className="font-extrabold text-slate-900 text-sm tracking-tight">
                  Hoot <span className="gradient-text-purple">Miner</span>
                </span>
                <span className="text-slate-300">•</span>
                <span className="text-xs text-slate-500 font-medium">© 2026 Code Repository Platform. All rights reserved.</span>
              </div>
            </div>
          </footer>
        );
      }

      // Main Public Client App
      function App() {
        const [activeTab, setActiveTab] = useState('home');
        const [selectedRepo, setSelectedRepo] = useState(null);
        const [selectedQuestionId, setSelectedQuestionId] = useState(null);
        const [repositories, setRepositories] = useState([]);
        const [questions, setQuestions] = useState([]);
        const [toasts, setToasts] = useState([]);
        const [isDbReady, setIsDbReady] = useState(!!window.HootDB);

        const addToast = (message, type = 'info') => {
          const id = Date.now() + Math.random();
          setToasts((prev) => [...prev, { id, message, type }]);
        };

        const removeToast = (id) => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        };

        const loadData = async () => {
          if (!window.HootDB) return;
          try {
            await window.HootDB.seedInitialDataIfNeeded();
            const repos = await window.HootDB.fetchRepositories();
            const qList = await window.HootDB.fetchQuestions();
            setRepositories(repos);
            setQuestions(qList);
          } catch (err) {
            console.warn("Data load error:", err);
          }
        };

        useEffect(() => {
          if (window.HootDB) {
            loadData();
            const unsubscribe = window.HootDB.subscribeToRepositories((newRepos) => {
              setRepositories(newRepos);
            });
            return () => { if (typeof unsubscribe === 'function') unsubscribe(); };
          } else {
            const handleReady = () => {
              setIsDbReady(true);
              loadData();
              if (window.HootDB) {
                window.HootDB.subscribeToRepositories((newRepos) => {
                  setRepositories(newRepos);
                });
              }
            };
            window.addEventListener('HootDBReady', handleReady);
            return () => window.removeEventListener('HootDBReady', handleReady);
          }
        }, []);

        const handleOpenRepoDetail = (repo, questionId = null) => {
          setSelectedRepo(repo);
          setSelectedQuestionId(questionId);
          setActiveTab('repo-detail');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 font-sans">
            <ToastContainer toasts={toasts} removeToast={removeToast} />
            <Navbar activeTab={activeTab} setActiveTab={setActiveTab} />
            
            <main className="flex-1">
              {activeTab === 'home' && (
                <>
                  <LandingHero
                    onLaunchWorkspace={() => setActiveTab('repos')}
                    onOpenCompiler={() => setActiveTab('compiler')}
                    repoCount={repositories.length}
                    questionCount={questions.length}
                  />
                  <FeatureGrid />
                </>
              )}

              {activeTab === 'repos' && (
                <RepositoryHub
                  repositories={repositories}
                  questions={questions}
                  onSelectRepo={handleOpenRepoDetail}
                />
              )}

              {activeTab === 'repo-detail' && selectedRepo && (
                <RepositoryDetailView
                  repo={selectedRepo}
                  questions={questions}
                  onBack={() => setActiveTab('repos')}
                  addToast={addToast}
                  initialQuestionId={selectedQuestionId}
                />
              )}

              {activeTab === 'compiler' && (
                <CodeCompiler addToast={addToast} />
              )}
            </main>

            <Footer />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
