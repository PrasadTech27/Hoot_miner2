    <!-- Firebase SDK Imports via CDN -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getDatabase, ref, get, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyA1QeDf1E_Kb1ZC15ahw1dY8hk3J0gXopY",
        authDomain: "thodu-65cb9.firebaseapp.com",
        databaseURL: "https://thodu-65cb9-default-rtdb.firebaseio.com",
        projectId: "thodu-65cb9",
        storageBucket: "thodu-65cb9.firebasestorage.app",
        messagingSenderId: "1070229943496",
        appId: "1:1070229943496:web:038e2e74c463e7acefa1fd",
        measurementId: "G-NF17LPGHWV"
      };

      const app = initializeApp(firebaseConfig);
      const rtdb = getDatabase(app);

      const DEFAULT_DEMO_REPO_IDS = ['repo-c-1', 'repo-c-2', 'repo-py-1', 'repo-java-1', 'repo-java-2'];
      const DEFAULT_DEMO_QUESTION_IDS = ['q-c-1', 'q-cpp-1', 'q-cpp-2', 'q-py-1', 'q-java-1', 'q-java-2'];

      window.HootDB = {
        async seedInitialDataIfNeeded() {
          try {
            for (const id of DEFAULT_DEMO_REPO_IDS) await remove(ref(rtdb, `repositories/${id}`));
            for (const qId of DEFAULT_DEMO_QUESTION_IDS) await remove(ref(rtdb, `questions_answers/${qId}`));
          } catch (err) { console.warn(err); }
        },

        async fetchRepositories() {
          try {
            const snapshot = await get(ref(rtdb, "repositories"));
            if (snapshot.exists()) return Object.values(snapshot.val()).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id));
            return [];
          } catch (err) {
            const local = localStorage.getItem("hootminer_repos");
            return local ? JSON.parse(local).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id)) : [];
          }
        },

        async fetchQuestions() {
          try {
            const snapshot = await get(ref(rtdb, "questions_answers"));
            if (snapshot.exists()) return Object.values(snapshot.val()).filter(q => q && !DEFAULT_DEMO_QUESTION_IDS.includes(q.id));
            return [];
          } catch (err) {
            const local = localStorage.getItem("hootminer_questions");
            return local ? JSON.parse(local).filter(q => q && !DEFAULT_DEMO_QUESTION_IDS.includes(q.id)) : [];
          }
        },

        async saveRepository(repo) {
          const id = repo.id || `repo-${Date.now()}`;
          const now = new Date().toISOString();
          const repoData = { ...repo, id, createdAt: repo.createdAt || now, updatedAt: now, visibility: repo.visibility || "Published" };
          try { await set(ref(rtdb, `repositories/${id}`), repoData); } catch (err) { console.warn(err); }
          const existing = await window.HootDB.fetchRepositories();
          const index = existing.findIndex((r) => r.id === id);
          if (index >= 0) existing[index] = repoData; else existing.push(repoData);
          localStorage.setItem("hootminer_repos", JSON.stringify(existing));
          return repoData;
        },

        async deleteRepository(repoId) {
          try {
            await remove(ref(rtdb, `repositories/${repoId}`));
            const allQuestions = await window.HootDB.fetchQuestions();
            const remainingQuestions = allQuestions.filter(q => q.repositoryId !== repoId);
            const qMap = {};
            remainingQuestions.forEach(q => { qMap[q.id] = q; });
            await set(ref(rtdb, "questions_answers"), qMap);
            localStorage.setItem("hootminer_questions", JSON.stringify(remainingQuestions));
          } catch (err) { console.warn(err); }
          const existing = await window.HootDB.fetchRepositories();
          const filtered = existing.filter((r) => r.id !== repoId);
          localStorage.setItem("hootminer_repos", JSON.stringify(filtered));
          return true;
        },

        async clearAllRepositories() {
          try {
            await set(ref(rtdb, "repositories"), {});
            await set(ref(rtdb, "questions_answers"), {});
          } catch (err) { console.warn(err); }
          localStorage.removeItem("hootminer_repos");
          localStorage.removeItem("hootminer_questions");
          return true;
        },

        async saveQuestion(question) {
          const id = question.id || `q-${Date.now()}`;
          const now = new Date().toISOString();
          const questionData = { ...question, id, displayOrder: Number(question.displayOrder) || 1, createdAt: question.createdAt || now };
          try { await set(ref(rtdb, `questions_answers/${id}`), questionData); } catch (err) { console.warn(err); }
          const existing = await window.HootDB.fetchQuestions();
          const index = existing.findIndex((q) => q.id === id);
          if (index >= 0) existing[index] = questionData; else existing.push(questionData);
          localStorage.setItem("hootminer_questions", JSON.stringify(existing));
          return questionData;
        },

        async deleteQuestion(questionId) {
          try { await remove(ref(rtdb, `questions_answers/${questionId}`)); } catch (err) { console.warn(err); }
          const existing = await window.HootDB.fetchQuestions();
          const filtered = existing.filter((q) => q.id !== questionId);
          localStorage.setItem("hootminer_questions", JSON.stringify(filtered));
          return true;
        },

        // --- CONTESTS HELPERS ---
        async fetchContests() {
          try {
            const snapshot = await get(ref(rtdb, "contests"));
            if (snapshot.exists()) return Object.values(snapshot.val());
            return [];
          } catch (e) {
            const local = localStorage.getItem("hootminer_contests");
            return local ? JSON.parse(local) : [];
          }
        },

        async saveContest(contest) {
          const id = contest.id || `contest-${Date.now()}`;
          const now = new Date().toISOString();
          const data = { ...contest, id, createdAt: contest.createdAt || now, updatedAt: now, status: contest.status || "Active" };
          try { await set(ref(rtdb, `contests/${id}`), data); } catch (e) { console.warn(e); }
          const existing = await window.HootDB.fetchContests();
          const idx = existing.findIndex(c => c.id === id);
          if (idx >= 0) existing[idx] = data; else existing.push(data);
          localStorage.setItem("hootminer_contests", JSON.stringify(existing));
          return data;
        },

        async deleteContest(id) {
          try { await remove(ref(rtdb, `contests/${id}`)); } catch (e) { console.warn(e); }
          const existing = await window.HootDB.fetchContests();
          const filtered = existing.filter(c => c.id !== id);
          localStorage.setItem("hootminer_contests", JSON.stringify(filtered));
          return true;
        },

        async fetchContestApplications() {
          try {
            const snapshot = await get(ref(rtdb, "contest_applications"));
            if (snapshot.exists()) return Object.values(snapshot.val());
            return [];
          } catch (e) {
            const local = localStorage.getItem("hootminer_applications");
            return local ? JSON.parse(local) : [];
          }
        },

        async updateApplicationStatus(appId, newStatus) {
          try {
            await set(ref(rtdb, `contest_applications/${appId}/status`), newStatus);
          } catch (e) {
            console.warn("Firebase status update error:", e);
          }
          const localApps = localStorage.getItem("hootminer_applications");
          if (localApps) {
            const parsed = JSON.parse(localApps);
            const idx = parsed.findIndex(a => a.id === appId);
            if (idx >= 0) {
              parsed[idx].status = newStatus;
              localStorage.setItem("hootminer_applications", JSON.stringify(parsed));
            }
          }
          return true;
        },

        subscribeToApplications(callback) {
          return onValue(ref(rtdb, "contest_applications"), (snapshot) => {
            if (snapshot.exists()) callback(Object.values(snapshot.val()));
            else callback([]);
          });
        }
      };
      window.dispatchEvent(new Event('HootDBReady'));
    </script>

    <!-- Main Standalone Admin Application Script -->
    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      const SAMPLE_CONTEST_IMAGES = [
        "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=800&q=80"
      ];

      // Icon Helper Component
      function Icon({ name, className = "w-4 h-4" }) {
        const svgProps = {
          xmlns: "http://www.w3.org/2000/svg", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className
        };

        switch (name) {
          case 'ShieldCheck': return <svg {...svgProps}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>;
          case 'Lock': return <svg {...svgProps}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
          case 'Mail': return <svg {...svgProps}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;
          case 'ArrowRight': return <svg {...svgProps}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
          case 'ArrowLeft': return <svg {...svgProps}><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>;
          case 'FolderGit2': return <svg {...svgProps}><path d="M9 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v5"/><circle cx="13" cy="12" r="2"/><path d="M18 19c-2.8 0-5-2.2-5-5v-2"/><circle cx="20" cy="19" r="2"/></svg>;
          case 'Trophy': return <svg {...svgProps}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>;
          case 'HelpCircle': return <svg {...svgProps}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>;
          case 'Tag': return <svg {...svgProps}><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>;
          case 'Database': return <svg {...svgProps}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>;
          case 'CheckCircle2': return <svg {...svgProps}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
          case 'Trash2': return <svg {...svgProps}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
          case 'RefreshCw': return <svg {...svgProps}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>;
          case 'LogOut': return <svg {...svgProps}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>;
          case 'FileCode2': return <svg {...svgProps}><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v4a1 1 0 0 0 1 1h4"/><path d="m5 12-3 3 3 3"/><path d="m9 18 3-3-3-3"/></svg>;
          case 'Search': return <svg {...svgProps}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
          case 'Plus': return <svg {...svgProps}><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
          case 'Edit2': return <svg {...svgProps}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>;
          case 'X': return <svg {...svgProps}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
          case 'AlertTriangle': return <svg {...svgProps}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>;
          case 'BookOpen': return <svg {...svgProps}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
          case 'Info': return <svg {...svgProps}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;
          default: return <svg {...svgProps}><circle cx="12" cy="12" r="10"/></svg>;
        }
      }

      // Toast System
      function ToastContainer({ toasts, removeToast }) {
        return (
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
            {toasts.map((toast) => (
              <ToastItem key={toast.id} toast={toast} onDismiss={() => removeToast(toast.id)} />
            ))}
          </div>
        );
      }

      function ToastItem({ toast, onDismiss }) {
        useEffect(() => {
          const timer = setTimeout(() => onDismiss(), toast.duration || 3500);
          return () => clearTimeout(timer);
        }, [toast, onDismiss]);

        const borders = {
          success: 'border-emerald-500/30 bg-emerald-950/80 text-emerald-100',
          error: 'border-rose-500/30 bg-rose-950/80 text-rose-100',
          warning: 'border-amber-500/30 bg-amber-950/80 text-amber-100',
          info: 'border-cyan-500/30 bg-cyan-950/80 text-cyan-100'
        };

        return (
          <div className={`pointer-events-auto flex items-center justify-between gap-3 p-4 rounded-2xl border backdrop-blur-md shadow-xl transition-all ${borders[toast.type] || borders.info}`}>
            <div className="flex items-center gap-3">
              <Icon name={toast.type === 'success' ? 'CheckCircle2' : 'Info'} className="w-5 h-5 shrink-0" />
              <span className="text-sm font-semibold">{toast.message}</span>
            </div>
            <button onClick={onDismiss} className="text-slate-400 hover:text-slate-200 p-1 rounded-lg">
              <Icon name="X" className="w-4 h-4" />
            </button>
          </div>
        );
      }

      // Admin Login Component
      function AdminLogin({ onLoginSuccess, addToast }) {
        const [email, setEmail] = useState('admin@hootminer.io');
        const [password, setPassword] = useState('hootminer2026');
        const [loading, setLoading] = useState(false);

        const handleSubmit = (e) => {
          e.preventDefault();
          setLoading(true);
          setTimeout(() => {
            if (email.trim() && password.trim()) {
              onLoginSuccess({ email, role: 'Administrator', loginTime: new Date().toISOString() });
              if (addToast) addToast('Authenticated successfully as Admin', 'success');
            } else {
              if (addToast) addToast('Please enter valid credentials', 'error');
            }
            setLoading(false);
          }, 400);
        };

        return (
          <div className="py-16 max-w-md mx-auto px-4">
            <div className="glass-panel p-8 rounded-3xl border border-slate-200 bg-white shadow-xl">
              <div className="text-center mb-8">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-600 to-sky-500 p-[1.5px] mx-auto mb-4 shadow-md">
                  <div className="w-full h-full bg-white rounded-[14px] flex items-center justify-center">
                    <Icon name="ShieldCheck" className="w-6 h-6 text-purple-600" />
                  </div>
                </div>
                <h2 className="text-2xl font-black text-slate-900">Admin Authentication</h2>
                <p className="text-xs text-slate-500 mt-1 font-medium">Sign in to manage repositories, Q&A entries, and contests.</p>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Admin Email</label>
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Password</label>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold"
                  />
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-extrabold text-sm shadow-lg flex items-center justify-center gap-2 cursor-pointer mt-6"
                >
                  {loading ? <span>Authenticating...</span> : <span>Enter Admin Dashboard &rarr;</span>}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // Repo Manager Component
      function RepoManager({ repositories, questions, onRefresh, addToast }) {
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [editingRepo, setEditingRepo] = useState(null);
        const [formData, setFormData] = useState({ title: '', category: 'C / C++', description: '', visibility: 'Published' });

        const handleSaveRepo = async (e) => {
          e.preventDefault();
          if (window.HootDB) {
            await window.HootDB.saveRepository({ ...editingRepo, ...formData });
            addToast('Repository saved successfully', 'success');
            setIsModalOpen(false);
            onRefresh();
          }
        };

        return (
          <div className="space-y-6">
            <div className="flex justify-between items-center">
              <h3 className="text-lg font-black text-slate-900">Repositories Collection</h3>
              <button onClick={() => { setEditingRepo(null); setFormData({ title: '', category: 'C / C++', description: '', visibility: 'Published' }); setIsModalOpen(true); }} className="px-5 py-2.5 bg-purple-600 text-white rounded-2xl font-extrabold text-xs shadow-md">
                + Create Repository
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {repositories.map((repo) => (
                <div key={repo.id} className="bg-white border p-6 rounded-3xl shadow-sm">
                  <span className="text-[11px] font-extrabold px-3 py-1 bg-purple-100 text-purple-800 rounded-xl">{repo.category}</span>
                  <h4 className="text-base font-bold text-slate-900 mt-3 mb-1">{repo.title}</h4>
                  <p className="text-xs text-slate-500 font-medium line-clamp-2">{repo.description}</p>
                </div>
              ))}
            </div>

            {isModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                <div className="w-full max-w-lg bg-white rounded-3xl p-6 border shadow-2xl">
                  <h3 className="text-lg font-black mb-4">{editingRepo ? 'Edit Repo' : 'Create Repo'}</h3>
                  <form onSubmit={handleSaveRepo} className="space-y-4">
                    <input type="text" required value={formData.title} onChange={(e) => setFormData({ ...formData, title: e.target.value })} placeholder="Title" className="w-full px-4 py-2 bg-slate-50 border rounded-2xl text-xs font-semibold" />

      // Root Admin Application
      function AdminApp() {
        const [adminUser, setAdminUser] = useState(null);
        const [repositories, setRepositories] = useState([]);
        const [questions, setQuestions] = useState([]);
        const [contests, setContests] = useState([]);
        const [applications, setApplications] = useState([]);
        const [toasts, setToasts] = useState([]);

        const addToast = (message, type = 'info') => {
          const id = Date.now() + Math.random();
          setToasts((prev) => [...prev, { id, message, type }]);
        };

        const removeToast = (id) => setToasts((prev) => prev.filter((t) => t.id !== id));

        const loadData = async () => {
          if (!window.HootDB) return;
          try {
            await window.HootDB.seedInitialDataIfNeeded();
            const repos = await window.HootDB.fetchRepositories();
            const qList = await window.HootDB.fetchQuestions();
            const cList = await window.HootDB.fetchContests();
            const aList = await window.HootDB.fetchContestApplications();
            setRepositories(repos);
            setQuestions(qList);
            setContests(cList);
            setApplications(aList);
          } catch (err) { console.warn(err); }
        };

        useEffect(() => {
          if (window.HootDB) {
            loadData();
            const unsub = window.HootDB.subscribeToApplications ? window.HootDB.subscribeToApplications((apps) => setApplications(apps)) : null;
            return () => { if (typeof unsub === 'function') unsub(); };
          } else {
            const handleReady = () => {
              loadData();
              if (window.HootDB && window.HootDB.subscribeToApplications) {
                window.HootDB.subscribeToApplications((apps) => setApplications(apps));
              }
            };
            window.addEventListener('HootDBReady', handleReady);
            return () => window.removeEventListener('HootDBReady', handleReady);
          }
        }, []);

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 font-sans">
            <ToastContainer toasts={toasts} removeToast={removeToast} />

            <header className="sticky top-0 z-40 w-full border-b border-slate-200 bg-white/90 backdrop-blur-xl shadow-sm">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 via-pink-500 to-sky-500 p-[1.5px] shadow-sm">
                    <div className="w-full h-full bg-white rounded-[10px] flex items-center justify-center">
                      <Icon name="ShieldCheck" className="w-5 h-5 text-purple-600" />
                    </div>
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-extrabold text-lg text-slate-900">Hoot <span className="gradient-text-purple">Miner</span></span>
                      <span className="px-2.5 py-0.5 text-[10px] font-extrabold uppercase rounded-lg bg-purple-100 text-purple-800 border border-purple-200">
                        Admin Portal
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-500 font-medium font-sans">Management & Solution Controls</div>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <a
                    href="index.html"
                    className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 border border-slate-200 text-xs font-bold text-slate-700 hover:text-purple-700 transition-all shadow-sm"
                  >
                    <Icon name="ArrowLeft" className="w-3.5 h-3.5 text-purple-600" />
                    <span>Public App &rarr;</span>
                  </a>
                </div>
              </div>
            </header>

            <main className="flex-1 w-full">
              {adminUser ? (
                <AdminDashboard
                  adminUser={adminUser}
                  onLogout={() => { setAdminUser(null); addToast('Signed out of Admin Portal', 'info'); }}
                  repositories={repositories}
                  questions={questions}
                  contests={contests}
                  applications={applications}
                  onRefresh={loadData}
                  addToast={addToast}
                />
              ) : (
                <AdminLogin onLoginSuccess={(user) => setAdminUser(user)} addToast={addToast} />
              )}
            </main>

            <footer className="border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500 font-medium">
              <div>Hoot Miner Admin System • Restricted Portal • All Actions Logged</div>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('admin-root'));
      root.render(<AdminApp />);
    </script>
  </body>
</html>
