    <!-- Firebase SDK Imports via CDN -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getDatabase, ref, get, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyA1QeDf1E_Kb1ZC15ahw1dY8hk3J0gXopY",
        authDomain: "thodu-65cb9.firebaseapp.com",
        databaseURL: "https://thodu-65cb9-default-rtdb.firebaseio.com",
        projectId: "thodu-65cb9",
        storageBucket: "thodu-65cb9.firebasestorage.app",
        messagingSenderId: "1070229943496",
        appId: "1:1070229943496:web:038e2e74c463e7acefa1fd",
        measurementId: "G-NF17LPGHWV"
      };

      const app = initializeApp(firebaseConfig);
      const rtdb = getDatabase(app);

      const DEFAULT_DEMO_REPO_IDS = ['repo-c-1', 'repo-c-2', 'repo-py-1', 'repo-java-1', 'repo-java-2'];
      const DEFAULT_DEMO_QUESTION_IDS = ['q-c-1', 'q-cpp-1', 'q-cpp-2', 'q-py-1', 'q-java-1', 'q-java-2'];
      const LOCAL_STORAGE_REPOS_KEY = "hootminer_repos";
      const LOCAL_STORAGE_QUESTIONS_KEY = "hootminer_questions";

      window.HootDB = {
        async seedInitialDataIfNeeded() {
          try {
            for (const id of DEFAULT_DEMO_REPO_IDS) {
              await remove(ref(rtdb, `repositories/${id}`));
            }
            for (const qId of DEFAULT_DEMO_QUESTION_IDS) {
              await remove(ref(rtdb, `questions_answers/${qId}`));
            }
            const localRepos = localStorage.getItem(LOCAL_STORAGE_REPOS_KEY);
            if (localRepos) {
              const parsed = JSON.parse(localRepos).filter(r => !DEFAULT_DEMO_REPO_IDS.includes(r.id));
              localStorage.setItem(LOCAL_STORAGE_REPOS_KEY, JSON.stringify(parsed));
            }
            const localQuestions = localStorage.getItem(LOCAL_STORAGE_QUESTIONS_KEY);
            if (localQuestions) {
              const parsedQ = JSON.parse(localQuestions).filter(q => !DEFAULT_DEMO_QUESTION_IDS.includes(q.id));
              localStorage.setItem(LOCAL_STORAGE_QUESTIONS_KEY, JSON.stringify(parsedQ));
            }
          } catch (err) {
            console.warn("Purge default demo data check:", err.message);
          }
        },

        async fetchRepositories() {
          try {
            const reposRef = ref(rtdb, "repositories");
            const snapshot = await get(reposRef);
            if (snapshot.exists()) {
              const data = snapshot.val();
              return Object.values(data).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id));
            } else {
              return [];
            }
          } catch (err) {
            console.warn("Firebase fetch repos error:", err);
            const local = localStorage.getItem(LOCAL_STORAGE_REPOS_KEY);
            if (local) return JSON.parse(local).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id));
            return [];
          }
        },

        async fetchQuestions() {
          try {
            const qRef = ref(rtdb, "questions_answers");
            const snapshot = await get(qRef);
            if (snapshot.exists()) {
              const data = snapshot.val();
              return Object.values(data).filter(q => q && !DEFAULT_DEMO_QUESTION_IDS.includes(q.id));
            } else {
              return [];
            }
          } catch (err) {
            console.warn("Firebase fetch questions error:", err);
            const local = localStorage.getItem(LOCAL_STORAGE_QUESTIONS_KEY);
            if (local) return JSON.parse(local).filter(q => q && !DEFAULT_DEMO_QUESTION_IDS.includes(q.id));
            return [];
          }
        },

        async saveRepository(repo) {
          const id = repo.id || `repo-${Date.now()}`;
          const now = new Date().toISOString();
          const repoData = { ...repo, id, createdAt: repo.createdAt || now, updatedAt: now, visibility: repo.visibility || "Published" };
          try {
            await set(ref(rtdb, `repositories/${id}`), repoData);
          } catch (err) { console.warn("Firebase save error:", err); }
          const existing = await window.HootDB.fetchRepositories();
          const index = existing.findIndex((r) => r.id === id);
          if (index >= 0) existing[index] = repoData;
          else existing.push(repoData);
          localStorage.setItem(LOCAL_STORAGE_REPOS_KEY, JSON.stringify(existing));
          return repoData;
        },

        async deleteRepository(repoId) {
          try {
            await remove(ref(rtdb, `repositories/${repoId}`));
            const allQuestions = await window.HootDB.fetchQuestions();
            const remainingQuestions = allQuestions.filter(q => q.repositoryId !== repoId);
            const qMap = {};
            remainingQuestions.forEach(q => { qMap[q.id] = q; });
            await set(ref(rtdb, "questions_answers"), qMap);
            localStorage.setItem(LOCAL_STORAGE_QUESTIONS_KEY, JSON.stringify(remainingQuestions));
          } catch (err) { console.warn("Firebase delete error:", err); }
          const existing = await window.HootDB.fetchRepositories();
          const filtered = existing.filter((r) => r.id !== repoId);
          localStorage.setItem(LOCAL_STORAGE_REPOS_KEY, JSON.stringify(filtered));
          return true;
        },

        async clearAllRepositories() {
          try {
            await set(ref(rtdb, "repositories"), {});
            await set(ref(rtdb, "questions_answers"), {});
          } catch (err) { console.warn("Error clearing database:", err); }
          localStorage.removeItem(LOCAL_STORAGE_REPOS_KEY);
          localStorage.removeItem(LOCAL_STORAGE_QUESTIONS_KEY);
          return true;
        },

        async saveQuestion(question) {
          const id = question.id || `q-${Date.now()}`;
          const now = new Date().toISOString();
          const questionData = { ...question, id, displayOrder: Number(question.displayOrder) || 1, createdAt: question.createdAt || now };
          try {
            await set(ref(rtdb, `questions_answers/${id}`), questionData);
          } catch (err) { console.warn("Firebase question save error:", err); }
          const existing = await window.HootDB.fetchQuestions();
          const index = existing.findIndex((q) => q.id === id);
          if (index >= 0) existing[index] = questionData;
          else existing.push(questionData);
          localStorage.setItem(LOCAL_STORAGE_QUESTIONS_KEY, JSON.stringify(existing));
          return questionData;
        },

        async deleteQuestion(questionId) {
          try {
            await remove(ref(rtdb, `questions_answers/${questionId}`));
          } catch (err) { console.warn("Firebase question delete error:", err); }
          const existing = await window.HootDB.fetchQuestions();
          const filtered = existing.filter((q) => q.id !== questionId);
          localStorage.setItem(LOCAL_STORAGE_QUESTIONS_KEY, JSON.stringify(filtered));
          return true;
        },

        subscribeToRepositories(callback) {
          const reposRef = ref(rtdb, "repositories");
          return onValue(reposRef, (snapshot) => {
            if (snapshot.exists()) {
              const list = Object.values(snapshot.val()).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id));
              callback(list);
            } else {
              callback([]);
            }
          }, (err) => {
            console.warn("Realtime listener error:", err);
          });
        }
      };
      window.dispatchEvent(new Event('HootDBReady'));
    </script>

      // Toast System for Admin
      function ToastContainer({ toasts, removeToast }) {
        return (
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
            {toasts.map((toast) => (
              <ToastItem key={toast.id} toast={toast} onDismiss={() => removeToast(toast.id)} />
            ))}
          </div>
        );
      }

      function ToastItem({ toast, onDismiss }) {
        useEffect(() => {
          const timer = setTimeout(() => onDismiss(), toast.duration || 3500);
          return () => clearTimeout(timer);
        }, [toast, onDismiss]);

        const borders = {
          success: 'border-emerald-500/30 bg-emerald-950/80 text-emerald-100',
          error: 'border-rose-500/30 bg-rose-950/80 text-rose-100',
          warning: 'border-amber-500/30 bg-amber-950/80 text-amber-100',
          info: 'border-cyan-500/30 bg-cyan-950/80 text-cyan-100'
        };

        return (
          <div className={`pointer-events-auto flex items-center justify-between gap-3 p-4 rounded-2xl border backdrop-blur-md shadow-xl transition-all ${borders[toast.type] || borders.info}`}>
            <div className="flex items-center gap-3">
              <Icon name={toast.type === 'success' ? 'CheckCircle2' : 'Info'} className="w-5 h-5 shrink-0" />
              <span className="text-sm font-semibold">{toast.message}</span>
            </div>
            <button onClick={onDismiss} className="text-slate-400 hover:text-slate-200 p-1 rounded-lg">
              <Icon name="X" className="w-4 h-4" />
            </button>
          </div>
        );
      }

      // Admin Login Component

        const [password, setPassword] = useState('hootminer2026');

          setLoading(true);

      // Repo Manager Component
      function RepoManager({ repositories, questions, onRefresh, addToast }) {
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [editingRepo, setEditingRepo] = useState(null);
        const [deleteConfirmRepo, setDeleteConfirmRepo] = useState(null);
        const [searchQuery, setSearchQuery] = useState('');

        const [formData, setFormData] = useState({
          title: '', category: 'C / C++', description: '', visibility: 'Published'
        });

        const questionCounts = useMemo(() => {
          return questions.reduce((acc, q) => {
            acc[q.repositoryId] = (acc[q.repositoryId] || 0) + 1;
            return acc;
          }, {});
        }, [questions]);

        const handleOpenCreateModal = () => {
          setEditingRepo(null);
          setFormData({ title: '', category: 'C / C++', description: '', visibility: 'Published' });
          setIsModalOpen(true);
        };

        const handleOpenEditModal = (repo) => {
          setEditingRepo(repo);
          setFormData({
            title: repo.title,
            category: repo.category,
            description: repo.description,
            visibility: repo.visibility || 'Published'
          });
          setIsModalOpen(true);
        };

        const handleSaveRepo = async (e) => {
          e.preventDefault();
          if (!formData.title.trim() || !formData.description.trim()) {
            addToast('Please fill out all required fields', 'error');
            return;
          }
          try {
            await window.HootDB.saveRepository({ ...editingRepo, ...formData });
            addToast(editingRepo ? 'Repository updated' : 'Repository created', 'success');
            setIsModalOpen(false);
            onRefresh();
          } catch (err) {
            addToast('Error saving repo: ' + err.message, 'error');
          }
        };

        const handleDeleteRepo = async () => {
          if (!deleteConfirmRepo) return;
          try {
            await window.HootDB.deleteRepository(deleteConfirmRepo.id);
            addToast(`Repository "${deleteConfirmRepo.title}" deleted`, 'warning');
            setDeleteConfirmRepo(null);
            onRefresh();
          } catch (err) {
            addToast('Error deleting repo', 'error');
          }
        };

        const filteredRepos = repositories.filter(r =>
          r.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          r.category.toLowerCase().includes(searchQuery.toLowerCase()) ||

      // Question Builder Component
      function QuestionBuilder({ repositories, questions, onRefresh, addToast }) {
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [editingQuestion, setEditingQuestion] = useState(null);
        const [deleteConfirmQuestion, setDeleteConfirmQuestion] = useState(null);
        const [selectedRepoFilter, setSelectedRepoFilter] = useState('All');
        const [searchQuery, setSearchQuery] = useState('');

        const [formData, setFormData] = useState({
          repositoryId: repositories.length > 0 ? repositories[0].id : '',
          questionTitle: '',
          explanation: '',
          codeSnippet: '',
          language: 'c',
          displayOrder: 1
        });

        const handleOpenCreateModal = () => {
          setEditingQuestion(null);
          setFormData({
            repositoryId: repositories.length > 0 ? repositories[0].id : '',
            questionTitle: '', explanation: '', codeSnippet: '', language: 'c', displayOrder: 1
          });
          setIsModalOpen(true);
        };

        const handleOpenEditModal = (q) => {
          setEditingQuestion(q);
          setFormData({
            repositoryId: q.repositoryId,
            questionTitle: q.questionTitle,
            explanation: q.explanation || '',
            codeSnippet: q.codeSnippet || '',
            language: q.language || 'c',
            displayOrder: q.displayOrder || 1
          });
          setIsModalOpen(true);
        };

        const handleSaveQuestion = async (e) => {
          e.preventDefault();
          if (!formData.repositoryId || !formData.questionTitle.trim() || !formData.codeSnippet.trim()) {
            addToast('Please fill out repository, question title, and code solution', 'error');
            return;
          }

          try {
            await window.HootDB.saveQuestion({ ...editingQuestion, ...formData });
            addToast(editingQuestion ? 'Question updated' : 'New Q&A entry added', 'success');
            setIsModalOpen(false);
            onRefresh();
          } catch (err) {
            addToast('Failed to save question: ' + err.message, 'error');
          }
        };

        const handleDelete = async () => {
          if (!deleteConfirmQuestion) return;
          try {
            await window.HootDB.deleteQuestion(deleteConfirmQuestion.id);
            addToast('Question solution deleted', 'warning');
            setDeleteConfirmQuestion(null);
            onRefresh();

            addToast('Error deleting question', 'error');

        const repoMap = useMemo(() => {
          return repositories.reduce((acc, r) => { acc[r.id] = r.title; return acc; }, {});
        }, [repositories]);

        const filteredQuestions = questions.filter(q => {
          const matchesRepo = selectedRepoFilter === 'All' || q.repositoryId === selectedRepoFilter;
          const matchesQuery = q.questionTitle.toLowerCase().includes(searchQuery.toLowerCase()) ||
                               (q.explanation && q.explanation.toLowerCase().includes(searchQuery.toLowerCase())) ||
                               (q.codeSnippet && q.codeSnippet.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesRepo && matchesQuery;

                  <div className="text-xs text-slate-500 font-bold mb-1">Top Active Category</div>
                  <div className="text-xl font-black text-emerald-700">{topCategory}</div>
                  <div className="text-[11px] text-slate-500 font-bold mt-1">{categoryCounts[topCategory] || 0} Repositories</div>
                </div>
                <div className="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-600 shadow-sm">
                  <Icon name="Tag" className="w-6 h-6" />
                </div>
              </div>

              <div className="glass-panel p-5 rounded-3xl border border-slate-200 bg-white flex items-center justify-between shadow-sm">
                <div>
                  <div className="text-xs text-slate-500 font-bold mb-1">Database Status</div>
                  <div className="text-lg font-black text-slate-900 flex items-center gap-1.5">
                    <Icon name="CheckCircle2" className="w-4 h-4 text-emerald-600" />
                    <span>Realtime</span>
                  </div>
                  <div className="text-[11px] text-emerald-600 font-bold mt-1">Ready for custom repos</div>
                </div>
                <div className="p-3.5 rounded-2xl bg-indigo-50 border border-indigo-200 text-indigo-600 shadow-sm">
                  <Icon name="Database" className="w-6 h-6" />
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2 border-b border-slate-200 mb-6">
              <button
                onClick={() => setActiveTab('repos')}
                className={`flex items-center gap-2 px-5 py-3 text-sm font-extrabold border-b-2 transition-all cursor-pointer ${
                  activeTab === 'repos' ? 'border-purple-600 text-purple-700' : 'border-transparent text-slate-500'
                }`}
              >
                <Icon name="FolderGit2" className="w-4 h-4" />
                <span>Repositories ({totalRepos})</span>
              </button>

              <button
                onClick={() => setActiveTab('questions')}
                className={`flex items-center gap-2 px-5 py-3 text-sm font-extrabold border-b-2 transition-all cursor-pointer ${
                  activeTab === 'questions' ? 'border-sky-600 text-sky-700' : 'border-transparent text-slate-500'
                }`}
              >
                <Icon name="FileCode2" className="w-4 h-4" />
                <span>Questions & Solutions ({totalQuestions})</span>
              </button>
            </div>

            {activeTab === 'repos' ? (
              <RepoManager
                repositories={repositories}
                questions={questions}
                onRefresh={onRefresh}
                addToast={addToast}
              />
            ) : (
              <QuestionBuilder
                repositories={repositories}
                questions={questions}
                onRefresh={onRefresh}
                addToast={addToast}
              />
            )}

            {confirmClearAll && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                <div className="relative w-full max-w-md bg-white border border-rose-200 rounded-3xl shadow-2xl p-6">
                  <div className="flex items-center gap-3 text-rose-600 mb-3">
                    <Icon name="Trash2" className="w-6 h-6" />
                    <h3 className="text-lg font-black text-slate-900">Purge All Repositories?</h3>
                  </div>
                  <p className="text-xs text-slate-600 font-medium leading-relaxed mb-4">
                    This will clear all repositories and questions from the database so you can start with a 100% clean list.
                  </p>
                  <div className="flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
                    <button onClick={() => setConfirmClearAll(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                    <button onClick={handleClearAllData} className="px-5 py-2.5 rounded-2xl bg-rose-600 text-white text-xs font-extrabold shadow-md">Confirm Clear</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // Root Admin Application
      function AdminApp() {
        const [adminUser, setAdminUser] = useState(null);
        const [repositories, setRepositories] = useState([]);
        const [questions, setQuestions] = useState([]);
        const [toasts, setToasts] = useState([]);

        const addToast = (message, type = 'info') => {
          const id = Date.now() + Math.random();
          setToasts((prev) => [...prev, { id, message, type }]);
        };

        const removeToast = (id) => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        };

        const loadData = async () => {
          if (!window.HootDB) return;
          try {
            await window.HootDB.seedInitialDataIfNeeded();
            const repos = await window.HootDB.fetchRepositories();
            const qList = await window.HootDB.fetchQuestions();
            setRepositories(repos);
            setQuestions(qList);
          } catch (err) {
            console.warn("Admin data load error:", err);
          }
        };

        useEffect(() => {
          if (window.HootDB) {
            loadData();
            const unsubscribe = window.HootDB.subscribeToRepositories((newRepos) => {
              setRepositories(newRepos);
            });
            return () => { if (typeof unsubscribe === 'function') unsubscribe(); };
          } else {
            const handleReady = () => {
              loadData();
              if (window.HootDB) {
                window.HootDB.subscribeToRepositories((newRepos) => {
                  setRepositories(newRepos);
                });
              }
            };
            window.addEventListener('HootDBReady', handleReady);
            return () => window.removeEventListener('HootDBReady', handleReady);
          }
        }, []);

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 font-sans">
            <ToastContainer toasts={toasts} removeToast={removeToast} />

            <header className="sticky top-0 z-40 w-full border-b border-slate-200 bg-white/90 backdrop-blur-xl shadow-sm">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 via-pink-500 to-sky-500 p-[1.5px] shadow-sm">
                    <div className="w-full h-full bg-white rounded-[10px] flex items-center justify-center">
                      <Icon name="ShieldCheck" className="w-5 h-5 text-purple-600" />
                    </div>
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-extrabold text-lg text-slate-900">Hoot <span className="gradient-text-purple">Miner</span></span>
                      <span className="px-2.5 py-0.5 text-[10px] font-extrabold uppercase rounded-lg bg-purple-100 text-purple-800 border border-purple-200">
                        Admin Portal
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-500 font-medium">Management & Solution Controls</div>
                  </div>
                </div>

                <div className="flex items-center gap-4">
                  <a
                    href="index.html"
                    className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 border border-slate-200 text-xs font-bold text-slate-700 hover:text-purple-700 hover:border-purple-300 transition-all shadow-sm"
                  >
                    <Icon name="ArrowLeft" className="w-3.5 h-3.5 text-purple-600" />
                    <span>Public Client App</span>
                  </a>
                </div>
              </div>
            </header>

            <main className="flex-1">
              {adminUser ? (
                <AdminDashboard
                  adminUser={adminUser}
                  onLogout={() => {
                    setAdminUser(null);
                    addToast('Logged out of Admin Portal', 'info');
                  }}
                  repositories={repositories}
                  questions={questions}
                  onRefresh={loadData}
                  addToast={addToast}
                />
              ) : (
                <AdminLogin
                  onLoginSuccess={(user) => setAdminUser(user)}
                  addToast={addToast}
                />
              )}
            </main>

            <footer className="border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500 font-medium">
              <div>Hoot Miner Admin System • Restricted Portal • All Actions Logged</div>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('admin-root'));
      root.render(<AdminApp />);
    </script>
  </body>
</html>
